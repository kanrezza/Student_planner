[project]
name = "lichhoc-backend"
version = "0.1.0"
description = "Lịch Học Cá Nhân – Flask REST API, lưu trữ PostgreSQL, nhận diện ảnh offline bằng EasyOCR"
requires-python = ">=3.12,<3.13"
# PyTorch (bản CPU) được cài riêng trong Dockerfile từ index CPU của PyTorch, trước các gói dưới đây.
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "gunicorn>=22.0",
    "easyocr>=1.7",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "rapidfuzz>=3.6",
    "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "reportlab>=4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Code spike là thử nghiệm dùng một lần (research R2/R4), cho phép comment tiếng Việt dài.
"spikes/*" = ["E501"]
# Test OCR dựng bảng tay bằng các dòng `box(...)` dài, giữ nguyên bố cục (`# fmt: skip`).
"tests/*" = ["E501"]
"scripts_validate.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ocr: chạy EasyOCR thật trên ảnh mẫu (chậm)",
    "slow: kiem tra hieu nang voi nhieu du lieu (vai giay)",
]
addopts = "-m 'not ocr'"
