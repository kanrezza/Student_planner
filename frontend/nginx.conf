server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh thời khoá biểu tối đa 20 MB (FR-028), cộng phần đầu multipart.
    client_max_body_size 21m;

    # Long-poll của mac-agent: backend chờ tối đa 25 giây (contracts/calendar-sync.md §1).
    location /api/sync/changes {
        proxy_pass http://backend:8000;
        proxy_read_timeout 35s;
        proxy_buffering off;
    }

    # Sao lưu/khôi phục (feature 003): file .lhbackup tới 500 MB, tạo/nạp có thể mất vài phút.
    location /api/backup/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 500m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # File đính kèm (feature 005): mỗi file tới 500 MB (trần của cài đặt), ghi thẳng xuống đĩa không đệm.
    location /api/attachments {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 510m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # API: nhận diện ảnh có thể mất tới ~60 giây.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
