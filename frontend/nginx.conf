server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh thời khoá biểu tối đa 20 MB (FR-028), cộng phần đầu multipart.
    client_max_body_size 21m;

    # Long-poll của mac-agent: backend chờ tối đa 25 giây (contracts/calendar-sync.md §1).
    location /api/sync/changes {
        proxy_pass http://backend:8000;
        proxy_read_timeout 35s;
        proxy_buffering off;
    }

    # API: nhận diện ảnh có thể mất tới ~60 giây.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
