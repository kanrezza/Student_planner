# Chế độ phát triển (tuỳ chọn):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# - backend chạy `flask run --debug`, mount mã nguồn để tự tải lại khi sửa code.
# - web-dev chạy Vite dev server tại http://127.0.0.1:5173 (vẫn chỉ mở trên localhost).
services:
  backend:
    entrypoint: ["flask", "--app", "app:create_app", "run", "--debug", "-h", "0.0.0.0", "-p", "8000"]
    volumes:
      - ./backend:/app

  web-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Trong container, proxy /api tới nginx của service web.
      VITE_API_PROXY: http://web:80
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - web
